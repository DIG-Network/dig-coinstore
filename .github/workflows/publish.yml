name: Publish to crates.io

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., v0.1.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    # No test/fmt/clippy re-run here: the PR release gates (ci.yml) already
    # verified the merged tree before this tag existed. Re-running the full
    # suite at deploy time is redundant and a flake-exposure surface that can
    # block a release for reasons unrelated to the tagged commit (#488, #489).
    # Deploy = build + package + publish only.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Verify package can be built
        run: cargo build --release

      - name: Verify package can be packaged
        run: cargo package --allow-dirty

      - name: Check if CARGO_REGISTRY_TOKEN is available
        run: |
          if [ -z "${{ secrets.CARGO_REGISTRY_TOKEN }}" ]; then
            echo "CARGO_REGISTRY_TOKEN secret is not set in repository settings"
            exit 1
          fi

      - name: Publish to crates.io
        run: cargo publish --allow-dirty --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: extract_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: "dig-coinstore v${{ steps.extract_version.outputs.VERSION }}"
          body: |
            ## dig-coinstore v${{ steps.extract_version.outputs.VERSION }}

            DIG L2 global coin state database: the authoritative persistent store of all spent
            and unspent coins under the coinset (UTXO-like) model. Accepts pre-validated blocks,
            applies state transitions, and answers coin lookups by id, puzzle hash, hint, parent
            and height, with Merkle proofs and rollback support. Runs no CLVM, produces no
            blocks, manages no mempool.

            ### Installation
            ```toml
            [dependencies]
            dig-coinstore = "${{ steps.extract_version.outputs.VERSION }}"
            ```

            See the [README](https://github.com/DIG-Network/dig-coinstore/blob/main/README.md) for usage instructions.
          draft: false
          prerelease: false
